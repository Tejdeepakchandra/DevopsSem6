# Sample CI Workflow - Maven + Docker
# This workflow demonstrates a complete CI pipeline for a Java/Maven project
# Triggers: push to main, pull requests to main

name: Java CI with Maven & Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Environment variables shared across all jobs
env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== Job 1: Build & Test =====
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Matrix strategy: test on multiple Java versions
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      # Cache Maven dependencies for faster builds
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -B    # -B for batch mode (non-interactive)

      - name: Run unit tests
        run: mvn test -B

      # Upload the built JAR as an artifact
      - name: Upload build artifact
        if: matrix.java-version == 17    # Only upload once
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ===== Job 2: Build Docker Image =====
  docker:
    name: Build & Push Docker Image
    needs: build                        # Wait for build job
    runs-on: ubuntu-latest
    if: github.event_name == 'push'     # Only on push, not PR
    
    permissions:
      contents: read
      packages: write                   # Required for GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
